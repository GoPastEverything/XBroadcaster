[workspace]
resolver = "2"
members = ["crates/core", "crates/media", "crates/x", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
xb-core = { path = "crates/core" }
xb-media = { path = "crates/media" }
xb-x = { path = "crates/x" }
